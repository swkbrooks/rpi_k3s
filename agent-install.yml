---
- name: Retrieve k3s server join token
  hosts: k3s_server
  become: true

  tasks:
    - name: Read node-token file
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_raw

    - name: Store decoded token as a fact
      ansible.builtin.set_fact:
        k3s_node_token: "{{ node_token_raw.content | b64decode | trim }}"

- name: Install k3s agent on worker nodes
  hosts: k3s_agents
  become: true
  vars:
    k3s_server_ip: "{{ hostvars[groups['k3s_server'][0]].ansible_host }}"
    k3s_token: "{{ hostvars[groups['k3s_server'][0]].k3s_node_token }}"

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'
      when: "'k3s-agent.service' not in services"

    - name: Run k3s agent install
      ansible.builtin.command: /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_EXEC: agent
        K3S_URL: "https://{{ k3s_server_ip }}:6443"
        K3S_TOKEN: "{{ k3s_token }}"
      when: "'k3s-agent.service' not in services"
