---
- name: Enable memory cgroups for k3s
  hosts: k3s_cluster
  become: true

  tasks:
    - name: Check whether cgroup params are already set
      ansible.builtin.command: grep -q cgroup_memory=1 /boot/firmware/cmdline.txt
      register: cgroup_check
      changed_when: false
      failed_when: false

    - name: Append cgroup params to cmdline.txt
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '^(.*)$'
        replace: '\1 cgroup_memory=1 cgroup_enable=memory'
      when: cgroup_check.rc != 0
      notify: Reboot Pi

  handlers:
    - name: Reboot Pi
      ansible.builtin.reboot:
        reboot_timeout: 120
